<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin — RAIHAN RQR</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap">
<div class="top"><a class="brand" href="index.html"><i></i>← Website</a><button class="pill ghost" id="logout" hidden>Logout</button></div>

<div class="card" id="login"><h2>Admin Login</h2><form id="loginForm" class="grid">
<label class="wide">Email<input id="em" type="email" required autocomplete="username"></label>
<label class="wide">Password<input id="pw" type="password" required autocomplete="current-password"></label>
<div class="wide"><button class="pill">Login</button><span class="msg" id="loginMsg"></span></div></form></div>

<div id="panel" hidden>
<div class="card"><h2>Website Content</h2><div class="grid">
<label>Name<input id="s_name"></label><label>Tagline (hero headline)<input id="s_tagline"></label>
<label class="wide">Intro (hero text)<textarea id="s_intro"></textarea></label>
<label class="wide">About / Bio<textarea id="s_bio"></textarea></label>
<label class="wide">Email<input id="s_email" type="email"></label>
<label>Role (tag)<input id="s_role" placeholder="Creative Designer"></label>
<label>Location<input id="s_location" placeholder="Dhaka, Bangladesh"></label>
<label class="wide">Availability<input id="s_avail" placeholder="Open to new projects"></label>
<label class="wide">Stats (one per line: number | label)<textarea id="s_stats" placeholder="4+ | Years Experience&#10;50+ | Projects Completed"></textarea></label>
<label class="wide">Services (one per line: title | description)<textarea id="s_services" style="min-height:130px"></textarea></label>
<label class="wide">Skills (one per line: name | percent, percent is optional)<textarea id="s_skills" placeholder="Photoshop | 90&#10;Premiere Pro | 80"></textarea></label>
<div class="wide"><small style="color:var(--muted)">Links (Instagram, Facebook, YouTube, WhatsApp, LinkedIn…)</small><div id="linkList"></div><button type="button" class="pill ghost" id="addLink" style="margin-top:8px">+ Add link</button></div>
<div class="wide"><button class="pill" id="saveS">Save content</button><span class="msg" id="sMsg"></span></div></div></div>

<div class="card"><h2 id="pTitle">Add Project</h2><form id="pForm" class="grid">
<label>Title<input id="title" required></label><label>Category<input id="category" placeholder="Branding, Video, Poster…"></label>
<label>Client<input id="client"></label><label>Project URL<input id="purl" placeholder="https://"></label>
<label class="wide">Description<textarea id="desc"></textarea></label>
<label class="wide">Image / Video<input id="file" type="file" accept="image/*,video/*"></label>
<div class="wide"><button class="pill" id="pSave">Save project</button> <button type="button" class="pill ghost" id="pReset" hidden>Cancel edit</button><span class="msg" id="pMsg"></span></div></form></div>

<div class="card"><h2>All Projects</h2><div id="list"></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/admin.js"></script>
</body></html>
